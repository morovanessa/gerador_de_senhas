<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="conteúdo">
    <div class="conteúdo-título">
        <img src="" alt="">
         <h2 class="título-principal">Gerador de senhas</h2>
         <h3 class="título-secundário">Gere instantaneamente uma senha aleatória e segura</h3>
    </div>
    <div class="conteudo-senha">
        <label for="senha">Senha</label>
        <input name="senha" type="text" id="campo-senha" readonly>
    </div>
    <div class="parametro">
      <h3 class="parametro-titulo">personalize sua senha</h3>
      <div class="parametro-coluna__senha">
        <div class="parametro-senha">
            <h4 class="parametro-senha__titulo">Numero de Caracteres</h4>
            <div class="parametro-senha-botoes">
                <button class="parametro-senha__botao">-</button>
                <p class="parametro-senha__texto">12</p>
                <button class="parametro-senha__botao">+</button>
            </div>
         </div>
         <div class="parametro-senha">
            <h4 class="parametro-senha__titulo">Características da Senha</h4>
            <div class="parametro-senha-checkbox">
                <input name="maíusculo" type="checkbox" class="checkbox" checked>
                <label for="maísculo">Letras Maíusculas</label>
            </div>
         </div>
      </div>
    </div>
  </section>  


</body>
</html>
